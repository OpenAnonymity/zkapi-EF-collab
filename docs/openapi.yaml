openapi: 3.1.0
info:
  title: zkAPI v2
  version: 2.0.0-testnet
  description: Local compatibility API plus the private Groth16 protocol API.
paths:
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat through the local wallet daemon
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: OpenAI-compatible response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /v1/responses:
    post:
      summary: OpenAI Responses-compatible request through the local wallet daemon
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Responses-compatible result}
  /v2/requests:
    post:
      summary: Submit an exact-payload-bound Groth16 request proof
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiRequestV2"}
      responses:
        "200": {description: Provider result and signed next state}
        "400": {description: Invalid request or proof}
        "409": {description: Replayed nullifier}
  /v2/withdraw/clearance:
    post:
      summary: Request a mutual-close clearance signature
      responses:
        "200": {description: Schnorr clearance signature}
  /v2/requests/{client_request_id}:
    get:
      summary: Recover a request transcript
      parameters:
        - in: path
          name: client_request_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Finalized transcript}
        "404": {description: Unknown request}
components:
  schemas:
    Groth16Proof:
      type: object
      required: [backend, proof]
      properties:
        backend: {const: groth16_bn254}
        proof: {type: string, contentEncoding: base64}
    ApiRequestV2:
      type: object
      required: [client_request_id, payload, payload_hash, public_inputs, proof]
      properties:
        client_request_id: {type: string}
        payload: {type: string}
        payload_hash: {type: string, pattern: "^0x[0-9a-f]+$"}
        public_inputs: {type: object, additionalProperties: true}
        proof: {$ref: "#/components/schemas/Groth16Proof"}
