name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  app-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-protocol

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Build app crates
        run: cargo build --workspace --exclude zkapi-integration-tests

      - name: Test app crates
        run: cargo test --workspace --exclude zkapi-integration-tests

      - name: Clippy app crates
        run: cargo clippy --workspace --exclude zkapi-integration-tests -- -D warnings

      - name: Validate demo scripts
        run: bash -n scripts/e2e-demo.sh docker/tee/attestation-hook.sh

  protocol-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-protocol

      - name: Provision swap for the Stwo prover
        run: |
          sudo fallocate -l 8G /mnt/zkapi-stwo.swap
          sudo chmod 600 /mnt/zkapi-stwo.swap
          sudo mkswap /mnt/zkapi-stwo.swap
          sudo swapon /mnt/zkapi-stwo.swap
          free -h

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Scarb for the production proof backend
        uses: software-mansion/setup-scarb@v1

      - name: Clippy protocol Rust workspace
        run: cargo clippy --manifest-path protocol/rust/Cargo.toml --workspace -- -D warnings

      - name: Test protocol Rust workspace
        run: cargo test --manifest-path protocol/rust/Cargo.toml --workspace -- --test-threads=1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-protocol

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build
        working-directory: protocol/contracts
        run: forge build

      - name: Forge test
        working-directory: protocol/contracts
        run: forge test -vvv

  cairo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-protocol

      - name: Install Scarb
        uses: software-mansion/setup-scarb@v1

      - name: Scarb build
        working-directory: protocol/cairo
        run: scarb build

      - name: Scarb test
        working-directory: protocol/cairo
        run: scarb test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-protocol

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t zkapi/ef-collaboration:ci .
