name: Checkout OA Chat
description: Check out OA Chat and its nested dependencies at the pinned parent gitlink

runs:
  using: composite
  steps:
    - name: Resolve pinned OA Chat commit
      id: oa-chat-ref
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:oa-chat)" >> "$GITHUB_OUTPUT"

    - name: Check out shared OA Chat
      uses: actions/checkout@v4
      with:
        repository: OpenAnonymity/oa-chat
        ref: ${{ steps.oa-chat-ref.outputs.sha }}
        path: oa-chat
        submodules: recursive
        persist-credentials: false
