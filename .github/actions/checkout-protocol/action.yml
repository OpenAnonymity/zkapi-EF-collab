name: Checkout protocol
description: Check out the protocol repository at the commit pinned by the parent gitlink

runs:
  using: composite
  steps:
    - name: Resolve pinned protocol commit
      id: protocol-ref
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:protocol)" >> "$GITHUB_OUTPUT"

    - name: Check out public protocol repository
      uses: actions/checkout@v4
      with:
        repository: mingyech/zkapi
        ref: ${{ steps.protocol-ref.outputs.sha }}
        path: protocol
        submodules: recursive
        persist-credentials: false
